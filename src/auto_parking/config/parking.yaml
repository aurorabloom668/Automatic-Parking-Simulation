# 车位坐标取自 car_demo/car_demo/worlds/park.world 的 <state> 段。
# parking_spot 模型的 pose 就是车位几何中心（四条白线相对 link 原点对称）。
planned_park:
  ros__parameters:
    frame_id: odom

    # ---- 任务几何（与 launch 中的出生点保持一致）----
    spawn: [0.0, 0.0, 3.14159265]
    lane_north_x: -7.0        # 阶段 A 北行车道
    lane_par_x: -7.8          # 阶段 B/C 南行车道
    route_radius: 5.0

    # 空的垂直车位，两侧为 suv 与 hatchback_red
    perpendicular_spot: [-15.5053, 12.5311, 0.0]
    perp_final_straight: 2.5

    # 空的侧方位车位，前后为两辆 hatchback_blue
    parallel_spot: [-10.6385, -1.62928, -1.57185]
    # 朝南揉库离线扫参（全程对邻车最小间隙约 0.25 m）
    par_radius: 4.5
    par_exit_radius: 4.2
    par_entry_extra: 0.25
    par_pre_angle: 0.0
    par_settle: 0.35
    # 找不到前车时，预停点相对倒库起点再沿车头方向多走的距离
    par_approach: 2.0
    par_goal_shift: -0.25

    spot_length: 5.42
    spot_width: 2.50

    # ---- 跟踪控制 ----
    speed_cruise: 1.4
    speed_reverse: 0.8
    speed_fine: 0.6
    control_rate: 50.0
    lookahead_forward: 2.2
    lookahead_reverse: 1.3
    throttle_kp: 0.35
    brake_kp: 0.5
    end_tolerance: 0.15

    # ---- 安全层 ----
    sonar_stop_distance: 0.35
    laser_stop_distance: 0.6
    safety_enabled: false

proximity_warn:
  ros__parameters:
    warn_distance: 0.5
    danger_distance: 0.10
    publish_rate: 5.0

gt_odom:
  ros__parameters:
    odom_frame: odom
    # prius.urdf 的根 link 是 dummy，必须挂在 dummy 上避免 base_link 双父节点
    base_frame: dummy
    ground_truth_topic: /prius/ground_truth
